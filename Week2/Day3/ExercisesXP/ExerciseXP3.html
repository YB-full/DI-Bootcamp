<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p><strong>Hello</strong> I hope you are enjoying <strong>this</strong> class. At the
<strong>end</strong> you <strong>will</strong> be great Developers!
<strong>Enjoy</strong> the <strong>JavaScript </strong> lessons</p>

<script>
    const allBoldItems=[];
    let boldItems=document.querySelectorAll("strong");
    let myP=document.querySelector("p");
    function getBoldItems(){ 

        for(let elem of boldItems){
            let textElem= elem.innerText;
            allBoldItems.push(textElem);
        }
        console.log(allBoldItems);
        
    }
    getBoldItems();

    function highlight(){
       for(let elem of boldItems){
            elem.style.color="blue";
        }

    }
    
    function returnItemsToDefault(){
         for(let elem of boldItems){
            elem.style.color="black";
        }
    }
    
    myP.addEventListener("mouseover",highlight);
    myP.addEventListener("mouseout",returnItemsToDefault);

    
    
</script>
</body>
</html>
