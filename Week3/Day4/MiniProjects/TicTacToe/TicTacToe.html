<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="TicTacToe.css">
</head>
<body>
    <div id="content">
        <h1>Tic Tac Toe Game</h1>
        <div id="difficulty-toggle" class="toggle-container">
            <div class="toggle-pill"></div>
            <span class="toggle-text active">Easy</span>
            <span class="toggle-text">Hard</span>
        </div>
        <div id ="start">
            <label for="player">Choose which one to play with:</label>
            <button type="button" id="symbolX">X</button>
            <button type="button" id="symbolO">O</button>
        </div>
        
        <div id="board" class="game-board">
            <div class="cell" id="0"></div>
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
        </div>
    </div>
    <div class="endgame">
        <div class="text"></div>
        <button type="submit" hidden="true">Replay</button>
    </div>
    
    <script src="TicTacToe.js"></script>
</body>
</html>
